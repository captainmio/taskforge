<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-labelledby="title desc">
  <title id="title">TaskForge project management icon</title>
  <desc id="desc">Green circular project management icon with a checklist and lightning bolt.</desc>

  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#10C66F"/>
      <stop offset="100%" stop-color="#00A651"/>
    </linearGradient>
    <linearGradient id="paper" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="100%" stop-color="#F2F7F4"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="8" flood-color="#006B38" flood-opacity="0.22"/>
    </filter>
  </defs>

  <!-- Background -->
  <circle cx="256" cy="256" r="220" fill="url(#bg)"/>

  <!-- Clipboard tabs -->
  <g fill="none" stroke="#FFFFFF" stroke-width="14" stroke-linecap="round" opacity="0.98">
    <path d="M165 171v-28c0-15 12-27 27-27h30"/>
    <path d="M222 116h68"/>
    <path d="M290 116h30c15 0 27 12 27 27v28"/>
  </g>

  <!-- Task card -->
  <rect x="126" y="164" width="265" height="214" rx="28" fill="url(#paper)" filter="url(#shadow)"/>

  <!-- Checklist item 1 -->
  <rect x="150" y="197" width="45" height="45" rx="12" fill="#04B45D"/>
  <path d="M162 218l9 9 16-18" fill="none" stroke="#FFFFFF" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/>
  <rect x="216" y="209" width="106" height="13" rx="6.5" fill="#08B95F"/>

  <!-- Checklist item 2 -->
  <rect x="150" y="253" width="45" height="45" rx="12" fill="#04B45D"/>
  <path d="M162 274l9 9 16-18" fill="none" stroke="#FFFFFF" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/>
  <rect x="216" y="265" width="86" height="13" rx="6.5" fill="#08B95F"/>

  <!-- Checklist item 3 -->
  <rect x="150" y="309" width="45" height="45" rx="12" fill="none" stroke="#04B45D" stroke-width="8"/>
  <rect x="216" y="321" width="92" height="13" rx="6.5" fill="#9DDCC0"/>

  <!-- Lightning bolt -->
  <path d="M338 164
           L288 278
           H326
           L299 366
           L393 248
           H350
           L392 164
           Z"
        fill="#FFFFFF"
        stroke="#00A651"
        stroke-width="7"
        stroke-linejoin="round"/>

  <!-- Motion lines -->
  <g fill="#7EE6B5" opacity="0.95">
    <rect x="400" y="214" width="42" height="10" rx="5"/>
    <rect x="417" y="241" width="18" height="10" rx="5"/>
    <rect x="404" y="268" width="38" height="10" rx="5"/>
    <rect x="388" y="295" width="34" height="10" rx="5"/>
  </g>
</svg>
